<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Gestionnaire de tâches</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <h1 id="titre">TaskFlow</h1>
    <p class="sous-titre">Un gestionnaire de tâches simple, versionné avec Git.</p>
  </header>

  <main class="conteneur">
    <section class="barre-outils">
      <input
        id="recherche"
        class="champ-recherche"
        type="search"
        placeholder="Rechercher une tâche…"
        aria-label="Rechercher une tâche"
      />
      <select id="filtre-statut" class="champ-filtre" aria-label="Filtrer par statut">
        <option value="toutes">Toutes les tâches</option>
        <option value="a-faire">À faire</option>
        <option value="terminees">Terminées</option>
      </select>
      <span id="compteur" class="compteur">0 tâche</span>
    </section>

    <ul id="liste-taches" class="liste-taches"></ul>
  </main>

  <footer class="pied">
    <p>TP5 — Travail collaboratif avec Git et GitHub</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
